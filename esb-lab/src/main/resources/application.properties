# esb-lab configuration
#
# Profiles:
#   %dev   quarkus dev on your workstation, everything reached through ../00-lab-setup/tunnel.sh as localhost
#   %prod  the container (docker compose --profile app); env vars point at Docker service names
#   %test  @QuarkusTest — Dev Services start throw-away Kafka / Artemis / Postgres containers
# The ${ENV:default} form means: environment variable if set, else the default.

quarkus.application.name=esb-lab
camel.context.name=esb-lab

# ---------- Topics and queues (one place, referenced from routes as {{...}}) ----------
esb.topic.order-status=orders.order-status.updated.v1
esb.topic.item-scan=tracking.item-scan.recorded.v1
esb.queue.scan-in=esb.tracking.scan.in
esb.queue.scan-dlq=esb.tracking.scan.dlq
esb.queue.status-board-cmd=esb.status-board.cmd

# ---------- Kafka: Confluent Platform dc-a ----------
%dev,prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP:localhost:9092}
camel.component.kafka.brokers=${kafka.bootstrap.servers}
%dev,prod.esb.schema-registry-url=${SR_URL:http://localhost:8081}
# Lab only: the Avro serializer registers schemas itself (auto.register.schemas defaults to true).
# In a governed setup it is false and schemas are registered from CI ("no schema, no topic"),
# see the Confluent course module 03. Endpoint option: &additionalProperties.auto.register.schemas=false

# ---------- Artemis ----------
%dev,prod.quarkus.artemis.url=${ARTEMIS_URL:tcp://localhost:61616}
%dev,prod.quarkus.artemis.username=esb
%dev,prod.quarkus.artemis.password=esb
quarkus.pooled-jms.max-connections=4

# ---------- Postgres (idempotent repository) ----------
quarkus.datasource.db-kind=postgresql
%dev,prod.quarkus.datasource.jdbc.url=${PG_URL:jdbc:postgresql://localhost:5432/esb}
%dev,prod.quarkus.datasource.username=esb
%dev,prod.quarkus.datasource.password=esb

# ---------- Partner webhook (WireMock) ----------
%dev,prod.esb.partner-webhook-url=${PARTNER_WEBHOOK_URL:http://localhost:8089/partner/webhook}

# ---------- Operations ----------
quarkus.http.host=0.0.0.0
quarkus.log.category."lab.esb".level=INFO
# Camel route + consumer health checks appear under /q/health
camel.health.enabled=true
# Camel route metrics appear under /q/metrics (Prometheus format)
quarkus.micrometer.export.prometheus.enabled=true

# ---------- Kubernetes manifests (module 07): mvn package writes target/kubernetes/*.yml ----------
quarkus.kubernetes.image-pull-policy=IfNotPresent
quarkus.container-image.image=esb-lab:dev

# ---------- Tests ----------
# Dev Services start Kafka, Artemis and Postgres in Docker for @QuarkusTest.
# Schema Registry: the test profile uses a mock registry inside the serializer (mock:// URL).
%test.esb.schema-registry-url=mock://esb-test
%test.esb.partner-webhook-url=http://localhost:8089/partner/webhook
# The status-board route would call a webhook that does not exist in tests; keep it stopped.
%test.esb.status-board.auto-startup=false
# Artemis Dev Services are off unless asked for (no URL in %test means no ConnectionFactory bean
# and "connectionFactory must be specified" at start-up — seen while testing this lab).
%test.quarkus.artemis.devservices.enabled=true
# Tests listen on 8081 by default — that is Schema Registry's port (on the lab host, and on your workstation via the tunnel). Use a random port.
quarkus.http.test-port=0
# quarkus-confluent-registry-avro would start an Apicurio Registry container; the mock:// URL makes it unnecessary.
quarkus.apicurio-registry.devservices.enabled=false
