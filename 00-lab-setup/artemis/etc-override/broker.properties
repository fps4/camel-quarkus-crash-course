# Artemis broker properties, applied on top of broker.xml at start-up.
# Copied into etc/ the first time the container creates its instance (see docker-compose.yml).
# Change this file -> `docker compose down -v artemis` style reset is needed (instance is created once).
#
# Rules for every address under "esb." (Artemis wildcard: "." separates words, "#" = any number of words):
#  - the broker redelivers a message at most 3 times when a transacted consumer rolls back,
#  - waits 1 s between attempts,
#  - then moves it to an auto-created queue DLQ.<original queue name> on address "DLQ".

addressSettings."esb.#".maxDeliveryAttempts=3
addressSettings."esb.#".redeliveryDelay=1000
addressSettings."esb.#".deadLetterAddress=DLQ
addressSettings."esb.#".autoCreateDeadLetterResources=true
addressSettings."esb.#".deadLetterQueuePrefix=DLQ.
